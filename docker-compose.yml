services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehicle-intelligence-backend
    ports:
      - "3001:3001"
    environment:
      # This is the dev compose; NODE_ENV=development keeps backend/src/config/env.ts
      # from treating the baked-in dev ML_SERVICE_API_KEY as a production secret.
      - NODE_ENV=development
      - PORT=3001
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-only-change-me-0000000000000000}
      - DATABASE_PATH=/app/data/vehicle_intelligence.db
      - UPLOAD_MAX_SIZE=524288000
      - JSON_BODY_LIMIT=1mb
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - TRUST_PROXY=false
      - LOG_LEVEL=info
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - vehicle-intelligence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      ml-service:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: vehicle-intelligence-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - LOG_LEVEL=info
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-dev-only-change-me-0000000000000000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o-mini}
      - OPENAI_TEXT_MODEL=${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      # Local Ollama VLM. Reach the host's Ollama from inside the container via
      # host.docker.internal. Leave OLLAMA_BASE_URL blank in .env to disable.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl}
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-gemma2:9b}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120}
      - UPLOADS_ROOT=/app/uploads
      - ALLOWED_UPLOAD_PATHS=/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - vehicle-intelligence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vehicle-intelligence-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
    networks:
      - vehicle-intelligence-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  vehicle-intelligence-network:
    driver: bridge
